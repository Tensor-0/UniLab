# @package _global_
# Canonical DM10 flat Manager-Based task declaration (PPO/APPO owners).
# DM10 = Damiao bipedal lower body, 10 DoF (leg_l1-5 + leg_r1-5), position
# actuators with the official Damiao deployment gains. Backend owner leaves
# inherit this file and only carry backend/algo identity/tuning.
env:
  scene:
    model_file: src/unilab/assets/robots/dm10/scene_flat.xml
    default_keyframe_name: home
    entities:
      robot:
        root_body_name: base_link
        joint_names:
          - leg_l1_joint
          - leg_l2_joint
          - leg_l3_joint
          - leg_l4_joint
          - leg_l5_joint
          - leg_r1_joint
          - leg_r2_joint
          - leg_r3_joint
          - leg_r4_joint
          - leg_r5_joint
        actuator_names:
          - leg_l1_joint_motor
          - leg_l2_joint_motor
          - leg_l3_joint_motor
          - leg_l4_joint_motor
          - leg_l5_joint_motor
          - leg_r1_joint_motor
          - leg_r2_joint_motor
          - leg_r3_joint_motor
          - leg_r4_joint_motor
          - leg_r5_joint_motor
        body_names: [base_link, leg_l5_link, leg_r5_link]
        geom_names: [floor]
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  observations:
    policy:
      enable_corruption: true
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: torso_gyro
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.2
            n_max: 0.2
            operation: add
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params:
            sensor_name: torso_upvector
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.05
            n_max: 0.05
            operation: add
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
            operation: add
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -1.5
            n_max: 1.5
            operation: add
        actions:
          func: unilab.envs.mdp.last_action
          params:
            action_name: joint_pos
        command:
          func: unilab.envs.mdp.generated_commands
          params:
            command_name: twist
    critic:
      terms:
        base_ang_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: torso_gyro
        projected_gravity:
          func: unilab.envs.mdp.projected_gravity_from_sensor
          params:
            sensor_name: torso_upvector
        joint_pos:
          func: unilab.envs.mdp.joint_pos_rel
        joint_vel:
          func: unilab.envs.mdp.joint_vel_rel
        actions:
          func: unilab.envs.mdp.last_action
          params:
            action_name: joint_pos
        command:
          func: unilab.envs.mdp.generated_commands
          params:
            command_name: twist
        base_lin_vel:
          func: unilab.envs.mdp.builtin_sensor
          params:
            sensor_name: pelvis_local_linvel
  actions:
    joint_pos:
      _target_: unilab.envs.mdp.JointPositionActionCfg
      entity_name: robot
      actuator_names: [".*"]
      scale: 0.25
      use_default_offset: true
  commands:
    twist:
      _target_: unilab.envs.mdp.UniformVelocityCommandCfg
      entity_name: robot
      resampling_time_range: [5.0, 5.0]
      heading_command: false
      heading_control_stiffness: 0.5
      rel_standing_envs: 0.0
      rel_heading_envs: 0.0
      rel_world_envs: 0.0
      rel_forward_envs: 0.0
      init_velocity_prob: 0.0
      ranges:
        lin_vel_x: [0.3, 0.5]
        lin_vel_y: [0.0, 0.0]
        ang_vel_z: [0.0, 0.0]
  events:
    reset_scene_to_default:
      func: unilab.envs.mdp.reset_scene_to_default
      mode: reset
    reset_root_state_uniform:
      func: unilab.envs.mdp.reset_root_state_uniform
      mode: reset
      params:
        pose_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [0.0, 0.0]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [-3.141592653589793, 3.141592653589793]
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.5, 0.5]
          roll: [-0.5, 0.5]
          pitch: [-0.5, 0.5]
          yaw: [-0.5, 0.5]
    base_mass:
      func: unilab.envs.mdp.randomize_rigid_body_mass
      mode: reset
      params:
        asset_cfg:
          _target_: SceneEntityCfg
          name: robot
          body_names: base_link
        mass_distribution_params: [0.0, 4.0]
        operation: add
        recompute_inertia: false
    base_com:
      func: unilab.envs.mdp.randomize_rigid_body_com
      mode: reset
      params:
        asset_cfg:
          _target_: SceneEntityCfg
          name: robot
          body_names: base_link
        com_range:
          x: [-0.05, 0.05]
          y: [-0.05, 0.05]
          z: [-0.05, 0.05]
    foot_friction:
      func: unilab.envs.mdp.geom_friction
      mode: reset
      params:
        asset_cfg:
          _target_: SceneEntityCfg
          name: robot
          geom_names: floor
        ranges: [0.3, 1.6]
        operation: scale
        axes: [0]
        shared_random: true
    joint_armature:
      func: unilab.envs.mdp.joint_armature
      mode: reset
      params:
        asset_cfg:
          _target_: SceneEntityCfg
          name: robot
          joint_names: ".*"
        ranges: [0.9, 1.1]
        operation: scale
    pd_gains:
      func: unilab.envs.mdp.pd_gains
      mode: reset
      params:
        asset_cfg:
          _target_: SceneEntityCfg
          name: robot
          actuator_names: ".*"
        kp_range: [0.9, 1.1]
        kd_range: [0.9, 1.1]
        operation: scale
    push_robot:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [8.0, 8.0]
      is_global_time: true
      params:
        velocity_range:
          x: [-1.0, 1.0]
          y: [-1.0, 1.0]
          z: [-0.5, 0.5]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    bad_orientation:
      func: unilab.envs.mdp.bad_orientation
      params:
        limit_angle: 1.0471975511965976
  policy_observation_group: policy
  critic_observation_group: critic

reward:
  tracking_lin_vel:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.track_lin_vel
    weight: 2.0
    params:
      tracking_sigma: 0.25
      command_name: twist
      sensor_name: pelvis_local_linvel
  tracking_ang_vel:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.track_ang_vel
    weight: 0.2
    params:
      tracking_sigma: 0.25
      command_name: twist
      sensor_name: torso_gyro
  # Gait phase reward (drives alternating bipedal stepping). Reuses the g1
  # implementation — our dm10 model exposes the same left_foot_pos /
  # right_foot_pos + pelvis_local_linvel sensors it binds.
  feet_phase:
    func: unilab.tasks.locomotion.g1.manager_terms.feet_phase
    weight: 1.2
    params:
      frequency: 1.5
      swing_height: 0.08
      tracking_sigma: 0.008
      min_forward_speed: 0.05
      command_name: twist
  # Left/right foot-height contrast against the gait-phase targets: drives
  # alternating stepping (the primary locomotion driver). Uses only the
  # left_foot_pos / right_foot_pos sensors dm10 exposes.
  feet_phase_contrast:
    func: unilab.tasks.locomotion.g1.manager_terms.feet_phase_contrast
    weight: 1.5
    params:
      frequency: 1.5
      swing_height: 0.08
      tracking_sigma: 0.008
      min_forward_speed: 0.05
      command_name: twist
  # Contact must match the expected gait phase (ported from Damiao humanoid-gym
  # `_reward_feet_contact_number`). A foot scores +1 when its measured contact
  # matches the phase target and -0.3 when it does not, so arbitrary lifting
  # patterns (hopping, stutter-stepping) become a net cost. MINIMAL-CHANGE
  # EXPERIMENT: this is the ONLY addition on top of the 00-52-12 baseline.
  feet_contact_number:
    func: unilab.tasks.locomotion.common.gait_terms.feet_contact_number
    weight: 1.2
    params:
      sensor_groups:
        - [left_foot_contact_0]
        - [right_foot_contact_0]
      cycle_time: 0.64
      contact_score: 1.0
      mismatch_score: -0.3
      double_support_band: 0.1
      command_name: twist
      command_threshold: 0.01
  # Feet air-time incentive inside the swing window (discourages both-feet-planted
  # shuffling and encourages lift-off); drives the stepping cadence.
  feet_air_time:
    func: unilab.tasks.locomotion.common.gait_terms.feet_air_time
    weight: 0.8
    params:
      sensor_groups:
        - [left_foot_contact_0]
        - [right_foot_contact_0]
      threshold_min: 0.10
      threshold_max: 0.5
      command_name: twist
      # ⚠️ 2026-09-18 修：原值 0.5 使这一项【恒不生效】。
      #   _command_gate（common/gait_terms.py:60-71）判据是【严格大于】：
      #       total = |v_xy| + |w_z| ;  gate = total > command_threshold
      #   而命令采样范围是 lin_vel_x=[0.3, 0.5]（上界恰好 0.5）
      #   ⇒ 训练分布内 gate 恒为 False ⇒ 权重 0.8 恒 ×0。
      #   铁证：4 条 run 的 tensorboard `reward/feet_air_time` 全部 = 0.000，
      #   而同为门控项的 feet_clearance / feet_slip / feet_contact_number
      #   （阈值均 0.01）都有正常非零值。
      #   ⇒ 唯一直接奖励「脚离地」的项从未生效，这就是「蹭地走、腾空 0%」的根因。
      #   改为 0.05：实测训练分布内 0/6 → 6/6 为真，且仍能区分「站着」与「走」。
      command_threshold: 0.05
  under_speed:
    func: unilab.tasks.locomotion.g1.manager_terms.under_speed
    weight: -0.2
    params:
      command_name: twist
  # Penalize foot sliding while in contact — stops the "shuffle/drag along the
  # ground" gait (the feet must lift and plant, not scrape forward).
  feet_slip:
    func: unilab.tasks.locomotion.common.gait_terms.feet_slip
    weight: -0.15
    params:
      sensor_groups:
        - [left_foot_contact_0]
        - [right_foot_contact_0]
      command_name: twist
      command_threshold: 0.01
      asset_cfg:
        _target_: SceneEntityCfg
        name: robot
        body_names: [leg_l5_link, leg_r5_link]
  # Penalize clearance-height deviation weighted by foot speed — forces a real
  # swing arc (big thigh lift) instead of a low scrape. Returns a COST, hence
  # the negative weight (Damiao's humanoid-gym uses the same idea).
  feet_clearance:
    func: unilab.tasks.locomotion.common.gait_terms.feet_clearance
    weight: -1.2
    params:
      target_height: 0.08
      command_name: twist
      command_threshold: 0.01
      asset_cfg:
        _target_: SceneEntityCfg
        name: robot
        body_names: [leg_l5_link, leg_r5_link]
  lin_vel_z:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.lin_vel_z
    weight: -1.0
    params:
      sensor_name: pelvis_local_linvel
  ang_vel_xy:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.ang_vel_xy
    weight: -0.25
    params:
      sensor_name: torso_gyro
  base_height:
    func: unilab.tasks.locomotion.common.manager_terms.base_height_l2
    weight: -300.0
    params:
      target_height: 0.693
  orientation:
    func: unilab.tasks.locomotion.common.sensor_reward_terms.orientation
    weight: -5.0
    params:
      sensor_name: torso_upvector
  pose:
    func: unilab.tasks.locomotion.g1.manager_terms.weighted_pose
    weight: -0.1
    params:
      # Joint order = base.yaml joint_names (leg_l1..l5, leg_r1..l5). Matches the
      # g1 gait-weighting so hip_pitch & knee (primary locomotion DOFs) are nearly
      # free (0.01) while roll/yaw/ankle stay heavily penalized (5.0) to avoid
      # splits / sprained ankles.
      pose_weights: [0.01, 1.0, 5.0, 0.01, 5.0,
                     0.01, 1.0, 5.0, 0.01, 5.0]
  # Action smoothness. Diagnosis (_diag_contact_jitter.py) showed the policy
  # emits white-noise actions: mean |Δaction| = 1.30, lag-1 autocorrelation
  # +0.10 (no temporal structure), driving 20 Hz foot jitter that makes any
  # contact-state reward (incl. feet_contact_number) statistically orthogonal
  # to the 1.56 Hz gait phase. These two terms are the prerequisite: they must
  # force low-frequency action output before phase-matching can bite.
  # Ported from Damiao humanoid-gym `_reward_action_smoothness` (first + second
  # difference) and `_reward_dof_acc`.
  action_rate:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.01
  action_acc:
    func: unilab.envs.mdp.action_acc_l2
    weight: -0.01
