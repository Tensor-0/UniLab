# @package _global_
# DM10 (Damiao 10-DoF lower body) whole-body tracking -- off-policy (FlashSAC/SAC) owner.
#
# Adapted from conf/sac/task/g1_motion_tracking/mujoco.yaml (the maintained
# off-policy WBT template) with the robot identity swapped to DM10. Off-policy
# tracking differs from the on-policy PPO task in ways that matter, so this is a
# port of the SAC contract rather than an inheritance of the PPO one:
#   - adaptive clip sampling (vs. uniform `start`)
#   - motion_clip_end termination + truncate_on_clip_end=true
#   - extra critic-only terms (body_pos / body_ori / sac_base_lin_vel)
#   - undesired_contacts penalty
#
# Reference motions: dm10-motion-tracking/data/converted/*.npz (11 RPO clips,
# individually speed-scaled to stay inside the DM4340P-24V 5.0 rad/s knee limit).
env:
  scene:
    model_file: src/unilab/assets/robots/dm10/scene_flat.xml
    default_keyframe_name: home
    entities:
      robot:
        root_body_name: base_link
        joint_names: &dm10_joints
          - leg_l1_joint
          - leg_l2_joint
          - leg_l3_joint
          - leg_l4_joint
          - leg_l5_joint
          - leg_r1_joint
          - leg_r2_joint
          - leg_r3_joint
          - leg_r4_joint
          - leg_r5_joint
        actuator_names:
          - leg_l1_joint_motor
          - leg_l2_joint_motor
          - leg_l3_joint_motor
          - leg_l4_joint_motor
          - leg_l5_joint_motor
          - leg_r1_joint_motor
          - leg_r2_joint_motor
          - leg_r3_joint_motor
          - leg_r4_joint_motor
          - leg_r5_joint_motor
        # base_link MUST be first: MotionCommand uses body_names[0] as the root
        # reference column when placing the robot on reset.
        body_names: &tracked_bodies
          - base_link
          - loin_yaw_Link
          - leg_l1_link
          - leg_l2_link
          - leg_l3_link
          - leg_l4_link
          - leg_l5_link
          - leg_r1_link
          - leg_r2_link
          - leg_r3_link
          - leg_r4_link
          - leg_r5_link
        # Declares the robot's `geom` namespace so SceneEntityCfg geom selectors
        # resolve (required by the foot_friction DR term; without it the backend
        # reports "capability 'geom' is unavailable ... not declared in EntityCfg").
        # Only the two sole geoms are listed: they are the ones that contact the
        # floor, so they are the only ones whose friction affects gait.
        geom_names:
          - leg_l5_foot_geom
          - leg_r5_foot_geom
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 10.0
  observations:
    actor:
      enable_corruption: true
      terms:
        command: &command_obs
          func: unilab.envs.mdp.generated_commands
          params: {command_name: motion}
        motion_anchor_pos_b: &anchor_pos_obs
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_pos_b
          params: {command_name: motion}
        motion_anchor_ori_b: &anchor_ori_obs
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_anchor_ori_b
          params: {command_name: motion}
        base_lin_vel: &base_lin_vel_obs
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: pelvis_local_linvel}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.1
            n_max: 0.1
        base_ang_vel: &base_ang_vel_obs
          func: unilab.envs.mdp.builtin_sensor
          params: {sensor_name: torso_gyro}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.2
            n_max: 0.2
        joint_pos: &joint_pos_obs
          func: unilab.tasks.motion_tracking.common.manager_terms.motion_joint_pos_rel
          params: {command_name: motion}
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -0.01
            n_max: 0.01
        joint_vel: &joint_vel_obs
          func: unilab.envs.mdp.joint_vel_rel
          noise:
            _target_: unilab.managers._noise.UniformNoiseCfg
            n_min: -1.5
            n_max: 1.5
        actions: &actions_obs
          func: unilab.envs.mdp.last_action
    critic:
      terms:
        command: *command_obs
        motion_anchor_pos_b: *anchor_pos_obs
        motion_anchor_ori_b: *anchor_ori_obs
        base_lin_vel: *base_lin_vel_obs
        base_ang_vel: *base_ang_vel_obs
        joint_pos: *joint_pos_obs
        joint_vel: *joint_vel_obs
        actions: *actions_obs
        body_pos:
          func: unilab.tasks.motion_tracking.common.manager_terms.robot_body_pos_b
          params: {command_name: motion}
        body_ori:
          func: unilab.tasks.motion_tracking.common.manager_terms.robot_body_ori_b
          params: {command_name: motion}
  actions:
    joint_pos:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionJointPositionActionCfg
      entity_name: robot
      actuator_names: [".*"]
      scale: 0.25
      use_default_offset: true
      command_name: motion
  commands:
    motion:
      _target_: unilab.tasks.motion_tracking.common.manager_terms.MotionCommandCfg
      entity_name: robot
      resampling_time_range: [1.0e9, 1.0e9]
      params:
        # 11 RPO clips converted by dm10-motion-tracking on 2026-09-12. Each was
        # speed-scaled individually so its peak knee angular velocity stays
        # within the DM4340P-24V limit (5.0 rad/s, 15% below the 5.86 rad/s
        # no-load rating). See dm10-motion-tracking/scripts/survey_motion_speed.py.
        motion_file:
          - motions/dm10/move_r.npz              # 右移        scale 0.91
          - motions/dm10/move_l.npz              # 左移        scale 1.08
          - motions/dm10/move_back.npz           # 后退        scale 1.26
          - motions/dm10/turn_r.npz              # 原地右转    scale 1.33
          - motions/dm10/turn_l.npz              # 原地左转    scale 1.58
          - motions/dm10/stand_to_walk_back.npz  # 站立→后退   scale 0.97
          - motions/dm10/walk_left90.npz         # 走+左转90°  scale 1.66
          - motions/dm10/walk_right90.npz        # 走+右转90°  scale 1.70
          - motions/dm10/walk_turn_around.npz    # 走+转身180° scale 1.95
          - motions/dm10/walk_left45.npz         # 走+左转45°  scale 1.57
          - motions/dm10/walk_right45.npz        # 走+右转45°  scale 1.76
        # dm10 has no torso_link; the root body doubles as the anchor.
        anchor_body_name: base_link
        body_names: *tracked_bodies
        sampling_mode: adaptive
        sampling_start_ratio: 0.0
        truncate_on_clip_end: true
        pose_range:
          x: [-0.05, 0.05]
          y: [-0.05, 0.05]
          z: [-0.01, 0.01]
          roll: [-0.1, 0.1]
          pitch: [-0.1, 0.1]
          yaw: [-0.2, 0.2]
        velocity_range:
          x: [-0.5, 0.5]
          y: [-0.5, 0.5]
          z: [-0.2, 0.2]
          roll: [-0.52, 0.52]
          pitch: [-0.52, 0.52]
          yaw: [-0.78, 0.78]
        joint_position_range: [-0.1, 0.1]
        # Per-episode joint zero-position offset. Randomizes the same bias the
        # real robot would see after a motor swap / re-zero, and applies to BOTH
        # the action target and the joint-pos observation (manager_terms.py:637 /
        # :677 / :687) — so the policy must tolerate an unknown zero without
        # losing tracking. Enabled 2026-09-12 ahead of the right-leg ID=1 motor
        # returning from repair (its zero will likely differ).
        joint_default_position_range: [-0.02, 0.02]
  # Domain randomization, per the survey's improvement #7. Added 2026-09-12.
  #
  # Rationale for each term (the two with the strongest evidence first):
  #   base_mass   - DM10下肢_实机参数登记表.md states outright that the sim's
  #                 masses are GUESSED, not weighed ("仿真模型里的质量、惯量是猜的，
  #                 不是称的"), and all 12 bodies' measured column is still blank.
  #                 The policy therefore learned its "feel" on wrong numbers.
  #                 +/-1.5 kg on the 4.77 kg base_link brackets that ignorance.
  #   foot_friction - gait quality (skating / stutter steps) is this project's
  #                 core pain, and foot friction directly sets the gait. Real
  #                 floors range from mat to tile; 4x range matches g1_deploy.
  #   push_robot  - see its own comment below.
  #
  # All values are copied from conf/ppo/task/g1_motion_tracking_deploy/mujoco.yaml
  # (the closest maintained reference: same motion-tracking owner). They are not
  # tuned for DM10 -- DM10-specific amplitudes would need real-robot data.
  #
  # Placed in the dm10 layer on purpose: dm10 inherits the g1 owner, so putting
  # these in g1_motion_tracking/ would silently turn them on for g1 as well.
  events:
    base_mass:
      func: unilab.envs.mdp.randomize_rigid_body_mass
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: base_link
        mass_distribution_params: [-1.5, 1.5]
        operation: add
        recompute_inertia: false
    foot_friction:
      func: unilab.envs.mdp.geom_friction
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          # Explicit list rather than ".*": SceneEntityCfg requires the entity to
          # declare a `geom` namespace, and a regex would also randomize the
          # torso/leg collision geoms (which never touch the floor). Only the two
          # sole geoms matter for gait.
          geom_names:
            - leg_l5_foot_geom
            - leg_r5_foot_geom
        ranges: [0.3, 1.2]
        operation: abs
        shared_random: true
    # Random external pushes (world-frame root velocity deltas).
    # Sizing notes:
    #   - amplitude +-0.4 m/s vs g1's +-1.0: dm10 is 10.86 kg (g1 ~35 kg), and the
    #     speed-scaled reference walks at only ~1.1 m/s (see motion_file comment).
    #   - interval: 3s with is_global_time=true was MEASURED to be near-inert --
    #     dm10 episodes average only 0.94-3.5 s, and a global timer does not
    #     restart on reset, so most pushes landed on/reset-adjacent frames.
    #     Verified 2026-09-12 (30 s of zero-action rollouts: 32 episodes, median
    #     inter-jump gap 0.3 s -- i.e. the "jumps" were resets, not pushes).
    #     The is_global_time/interval fix is staged as the next batch so this
    #     batch stays a single-variable change.
    # Angular axes stay zero: non-zero angular deltas require a backend capability
    # that fails closed at construction (events.py:1092-1097).
    push_robot:
      func: unilab.envs.mdp.push_by_setting_velocity
      mode: interval
      interval_range_s: [3.0, 3.0]
      is_global_time: true
      params:
        velocity_range:
          x: [-0.4, 0.4]
          y: [-0.4, 0.4]
          z: [-0.2, 0.2]
          roll: [0.0, 0.0]
          pitch: [0.0, 0.0]
          yaw: [0.0, 0.0]
  terminations:
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
    motion_clip_end:
      func: unilab.tasks.motion_tracking.common.manager_terms.motion_clip_end
      time_out: true
      params: {command_name: motion}
    anchor_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_pos_z_only
      params: {command_name: motion, threshold: 0.25}
    anchor_ori:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_anchor_ori
      params:
        command_name: motion
        threshold: 0.8
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
    # dm10 has no arms: only the two foot links are tracked end-effectors.
    ee_body_pos:
      func: unilab.tasks.motion_tracking.common.manager_terms.bad_motion_body_pos_z_only
      params:
        command_name: motion
        threshold: 0.25
        body_names:
          - leg_l5_link
          - leg_r5_link
  policy_observation_group: actor
  critic_observation_group: critic

reward:
  motion_global_root_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_position_error_exp
    weight: 1.0
    params: {command_name: motion, std: 0.3}
  motion_global_root_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_anchor_orientation_error_exp
    weight: 0.5
    params: {command_name: motion, std: 0.4}
  motion_body_pos:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_position_error_exp
    weight: 2.0
    params: {command_name: motion, std: 0.3}
  motion_body_ori:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_relative_body_orientation_error_exp
    weight: 1.0
    params: {command_name: motion, std: 0.4}
  motion_body_lin_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_linear_velocity_error_exp
    weight: 1.0
    params: {command_name: motion, std: 1.0}
  motion_body_ang_vel:
    func: unilab.tasks.motion_tracking.common.manager_terms.motion_global_body_angular_velocity_error_exp
    weight: 1.0
    params: {command_name: motion, std: 3.14}
  action_rate_l2:
    func: unilab.envs.mdp.action_rate_l2
    weight: -0.1
  # ── Disabled 2026-09-12 after a reward-term audit ────────────────────────
  # Read every reward/<term> scalar from the A/B training logs (25k iters each)
  # and measured mean contribution + non-zero step fraction:
  #
  #   joint_limit        weight -10.0 but fires on  0.2% of steps, peak 2e-6
  #                      -> contributes ~0. The huge weight never engages.
  #   undesired_contacts weight  -0.1 but fires on  5.9% of steps, magnitude 1e-5
  #                      -> effectively 0.
  #   motion_joint_pos   weight   0.0 -> never scored at all.
  #   motion_joint_vel   weight   0.0 -> never scored at all.
  #
  # Kept as explicit `null` (rather than deleted) so the names stay visible and
  # the disabled set is reviewable. Nulling is the same mechanism the A/B
  # experiment used via `reward.<term>=null`.
  #
  # Consequence for interpreting the A/B result: group B "turned off 5 penalty
  # terms" but only ONE of them (action_rate_l2, 4.1% of positive reward) ever
  # did anything — so that experiment was effectively a single-variable test and
  # could not probe "reward minimisation". See the improvement plan, §6.10.
  joint_limit: null
  undesired_contacts: null
  motion_joint_pos: null
  motion_joint_vel: null
